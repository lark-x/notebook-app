<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - 笔记本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">NoteFlow</h1>
        <button id="btn-new-notebook" title="新建笔记本">+</button>
      </div>
      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="搜索笔记...">
      </div>
      <nav id="notebook-list"></nav>
      <div class="sidebar-footer">
        <button id="btn-export" title="导出数据">导出</button>
        <button id="btn-import" title="导入数据">导入</button>
        <button id="btn-toggle-theme" title="切换主题">🌙</button>
      </div>
    </aside>

    <!-- 笔记列表 -->
    <section id="note-list-panel">
      <div class="panel-header">
        <h2 id="current-notebook-name">全部笔记</h2>
        <button id="btn-new-note" title="新建笔记">+ 新建</button>
      </div>
      <div id="note-list"></div>
    </section>

    <!-- 编辑器 -->
    <main id="editor-panel">
      <div id="editor-empty" class="empty-state">
        <p>选择或创建一条笔记开始编辑</p>
      </div>
      <div id="editor-container" style="display:none;">
        <div class="editor-toolbar">
          <input type="text" id="note-title" placeholder="笔记标题...">
          <div class="toolbar-actions">
            <button class="toolbar-btn" data-cmd="bold" title="粗体">B</button>
            <button class="toolbar-btn" data-cmd="italic" title="斜体"><i>I</i></button>
            <button class="toolbar-btn" data-cmd="underline" title="下划线"><u>U</u></button>
            <button class="toolbar-btn" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" data-cmd="insertUnorderedList" title="无序列表">•</button>
            <button class="toolbar-btn" data-cmd="insertOrderedList" title="有序列表">1.</button>
            <button class="toolbar-btn" data-cmd="formatBlock" data-value="h2" title="标题">H</button>
            <button class="toolbar-btn" data-cmd="formatBlock" data-value="blockquote" title="引用">❝</button>
            <button class="toolbar-btn" data-cmd="insertHorizontalRule" title="分割线">—</button>
            <span class="toolbar-sep"></span>
            <button id="btn-add-tag" title="添加标签">🏷️</button>
            <button id="btn-delete-note" title="删除笔记">🗑️</button>
          </div>
        </div>
        <div id="note-tags"></div>
        <div id="note-content" contenteditable="true" placeholder="开始输入..."></div>
        <div class="editor-status">
          <span id="word-count">0 字</span>
          <span id="last-saved"></span>
        </div>
      </div>
    </main>
  </div>

  <!-- 模态框 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <input type="file" id="import-file" accept=".json" style="display:none;">
  <script src="app.js"></script>
</body>
</html>
